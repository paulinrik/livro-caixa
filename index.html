<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D3F63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Livro-caixa">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Marcador de receitas e despesas com categorias, meses separados e gráfico comparativo.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Livro-caixa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{color-scheme:light}
html{-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}

/* Layout: cabeçalho com navegação de mês, resumo do mês, formulário fixo à esquerda (desktop) e gráfico, lista e categorias à direita. No celular tudo em uma coluna, formulário logo após o resumo. */
:root {
  --bg: #F2F5F3;
  --surface: #FFFFFF;
  --ink: #14201B;
  --muted: #566861;
  --line: #DCE4E0;
  --hl: #E8EFEB;
  --accent: #1D3F63;
  --on-accent: #FFFFFF;
  --rec: #0B7F5B;
  --rec-bg: #E1F2EB;
  --desp: #C8432B;
  --desp-bg: #FBE7E2;
  --font-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1613; --surface: #161F1B; --ink: #E7EFEB; --muted: #92A39B; --line: #26322D; --hl: #1D2924;
    --accent: #8FB6E6; --on-accent: #0C1A2A; --rec: #3FC79B; --rec-bg: #143127; --desp: #F28B73; --desp-bg: #3A1F19;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1613; --surface: #161F1B; --ink: #E7EFEB; --muted: #92A39B; --line: #26322D; --hl: #1D2924;
  --accent: #8FB6E6; --on-accent: #0C1A2A; --rec: #3FC79B; --rec-bg: #143127; --desp: #F28B73; --desp-bg: #3A1F19;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.45 var(--font-body);
  padding-block: max(20px, env(safe-area-inset-top, 0px)) calc(40px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app {
  max-width: 1040px; margin: 0 auto; display: grid; gap: 16px;
  grid-template-areas: "head" "tabs" "sum" "form" "chart" "list" "brk" "bk" "foot";
}
.app > * { min-width: 0; }
@media (min-width: 860px) {
  .app {
    grid-template-columns: 340px minmax(0, 1fr);
    grid-template-areas: "head head" "tabs tabs" "sum sum" "form chart" "form list" "form brk" "form bk" "foot foot";
    align-items: start;
  }
  #formCard { position: sticky; top: 16px; align-self: start; }
  .app[data-view="per"] {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    grid-template-areas: "head head" "tabs tabs" "pctl pctl" "psum psum" "pchart pchart" "pbrk plist" "bk bk" "foot foot";
  }
}
.app[data-view="per"] { grid-template-areas: "head" "tabs" "pctl" "psum" "pchart" "pbrk" "plist" "bk" "foot"; }
@media (min-width: 860px) {
  .app[data-view="per"] { grid-template-areas: "head head" "tabs tabs" "pctl pctl" "psum psum" "pchart pchart" "pbrk plist" "bk bk" "foot foot"; }
}

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; font-weight: 700; text-wrap: balance; }
h2 { font-size: 17px; line-height: 1.2; }

/* cabeçalho */
.head { grid-area: head; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.head h1 { font-size: 26px; letter-spacing: -0.01em; }
.monthnav { display: flex; align-items: center; gap: 6px; }
.monthnav .label { font-family: var(--font-display); font-weight: 700; font-size: 17px; min-width: 9.5em; text-align: center; }
.iconbtn {
  width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 20px; line-height: 1;
}
.iconbtn:hover { background: var(--hl); }
.textbtn {
  height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); cursor: pointer; font-size: 14px;
}
.textbtn:hover { background: var(--hl); }

/* resumo */
.sum { grid-area: sum; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 0; overflow: hidden; }
.sum > div { padding: 14px 16px; min-width: 0; }
.sum > div + div { border-left: 1px solid var(--line); }
.sum .k { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.sum .v { font-family: var(--font-display); font-weight: 700; font-size: 22px; margin-top: 4px; overflow-wrap: anywhere; }
.sum .rec .v { color: var(--rec); }
.sum .desp .v { color: var(--desp); }
.sum .saldo .v.neg { color: var(--desp); }
@media (max-width: 520px) {
  .sum { grid-template-columns: 1fr 1fr; }
  .sum .saldo { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--line); }
  .sum > div:nth-child(2) { border-left: 1px solid var(--line); }
  .sum .v { font-size: 20px; }
}

/* formulário */
#formCard { grid-area: form; display: grid; gap: 12px; }
#formCard label { font-size: 13px; font-weight: 600; display: block; margin-bottom: 4px; }
#formCard .opt { font-weight: 400; color: var(--muted); }
.field input, .field select, .money {
  width: 100%; height: 44px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg); padding: 0 12px;
}
.field select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 19px, calc(100% - 13px) 19px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
.money { display: flex; align-items: center; gap: 8px; padding: 0 12px; }
.money span { color: var(--muted); font-weight: 600; }
.money input { border: 0; background: transparent; height: 100%; padding: 0; flex: 1; min-width: 0; font-size: 18px; font-weight: 600; }
.money:focus-within, .field input:focus, .field select:focus { border-color: var(--accent); }
.money input:focus-visible { outline: none; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 4px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); }
.seg button { height: 38px; border-radius: 9px; border: 1px solid transparent; background: transparent; cursor: pointer; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"][data-tipo="despesa"] { background: var(--desp-bg); color: var(--desp); border-color: var(--desp); }
.seg button[aria-pressed="true"][data-tipo="receita"] { background: var(--rec-bg); color: var(--rec); border-color: var(--rec); }
.newcat { display: flex; gap: 8px; margin-top: 8px; }
.newcat input { flex: 1; min-width: 0; }
.primary {
  height: 46px; border-radius: 10px; border: 0; cursor: pointer; font-weight: 600;
  background: var(--accent); color: var(--on-accent);
}
.primary:disabled { opacity: 0.5; cursor: default; }
.secondary { height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; }
#msg { min-height: 1.4em; margin: 0; font-size: 13px; color: var(--muted); }
#msg.ok { color: var(--rec); }
#msg.err { color: var(--desp); }

/* gráfico */
#chartCard { grid-area: chart; }
.cardhead { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.legend .r i { background: var(--rec); }
.legend .d i { background: var(--desp); }
svg.chart { display: block; width: 100%; height: auto; max-width: 100%; }
.chart .grid { stroke: var(--line); stroke-width: 1; fill: none; }
.chart text { fill: var(--muted); font: 11px var(--font-body); }
.chart text.sel { fill: var(--ink); font-weight: 600; }
.chart .hl { fill: var(--hl); }
.chart .br { fill: var(--rec); }
.chart .bd { fill: var(--desp); }
.chart .hit { fill: transparent; }
.chart g.col { cursor: pointer; }
.chart g.col:focus-visible { outline: 2px solid var(--accent); }
.empty { color: var(--muted); padding: 18px 4px; text-align: left; }

/* lista */
#listCard { grid-area: list; }
.dia + .dia { margin-top: 14px; }
.dia h3 { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-family: var(--font-body); font-weight: 600; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.dia ul { list-style: none; margin: 0; padding: 0; }
.row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
.row:last-child { border-bottom: 0; }
.dot { width: 10px; height: 10px; border-radius: 50%; }
.dot.r { background: var(--rec); }
.dot.d { background: var(--desp); }
.row .txt { min-width: 0; }
.row .txt b { font-weight: 600; display: block; overflow-wrap: anywhere; }
.row .txt .obs { color: var(--muted); font-size: 13px; display: block; overflow-wrap: anywhere; }
.amt { font-weight: 600; white-space: nowrap; }
.amt.r { color: var(--rec); }
.amt.d { color: var(--desp); }
.ghost { border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 13px; padding: 6px 8px; border-radius: 8px; }
.ghost:hover { background: var(--hl); color: var(--ink); }
.confirm { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px; background: var(--desp-bg); color: var(--desp); font-size: 13px; font-weight: 600; }
.confirm button { height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--desp); background: var(--surface); color: var(--desp); cursor: pointer; font-weight: 600; }
.confirm button.danger { background: var(--desp); color: var(--surface); }

/* categorias */
#brkCard { grid-area: brk; }
.tabs { display: inline-flex; gap: 4px; padding: 3px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); }
.tabs button { height: 32px; padding: 0 12px; border-radius: 8px; border: 0; background: transparent; cursor: pointer; color: var(--muted); font-weight: 600; font-size: 13px; }
.tabs button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
.brk { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 12px; }
.brk .top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.brk .top span:first-child { overflow-wrap: anywhere; }
.brk .pct { color: var(--muted); font-size: 12px; margin-left: 6px; }
.bar { height: 8px; border-radius: 4px; background: var(--hl); margin-top: 5px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 4px; }
.bar i.r { background: var(--rec); }
.bar i.d { background: var(--desp); }

#foot { grid-area: foot; color: var(--muted); font-size: 12px; margin: 0; }
@media (prefers-reduced-motion: no-preference) {
  .bar i { transition: width 0.25s ease; }
}


/* abas e períodos */
.views { grid-area: tabs; justify-self: start; }
.views button { height: 38px; padding: 0 20px; font-size: 14px; }
#pctl { grid-area: pctl; }
#psum { grid-area: psum; }
#pchart { grid-area: pchart; }
#pbrk { grid-area: pbrk; }
#plist { grid-area: plist; }
.pctlrow { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between; }
.pctlrow .field { flex: 1; min-width: 190px; }
.pcustom { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
#pctl label { font-size: 13px; font-weight: 600; display: block; margin-bottom: 4px; }
#prange { margin: 12px 0 0; }
.prow { grid-template-columns: auto minmax(0, 1fr) auto; }
.moreRow { margin-top: 12px; }
#bkCard{grid-area:bk}
.hint{margin:0 0 12px;color:var(--muted);font-size:13px}
.bkrow{display:flex;flex-wrap:wrap;gap:8px}
#bkmsg{min-height:1.4em;margin:8px 0 0;font-size:13px;color:var(--muted)}
#bkmsg.ok{color:var(--rec)}#bkmsg.err{color:var(--desp)}
</style>
</head>
<body>
<div class="app" id="app" data-view="mes">
  <header class="head">
    <h1>Livro-caixa</h1>
    <div class="monthnav" id="monthnav" role="group" aria-label="Mês exibido">
      <button type="button" class="iconbtn" data-nav="-1" aria-label="Mês anterior">&#8249;</button>
      <div class="label" id="mesLabel" aria-live="polite"></div>
      <button type="button" class="iconbtn" data-nav="1" aria-label="Próximo mês">&#8250;</button>
      <button type="button" class="textbtn" id="btnHoje" data-nav="hoje" hidden>Mês atual</button>
    </div>
  </header>

  <nav class="tabs views" id="views" aria-label="Seções">
    <button type="button" data-view="mes" aria-pressed="true">Mês</button>
    <button type="button" data-view="per" aria-pressed="false">Períodos</button>
  </nav>

  <section class="card" id="pctl" aria-label="Filtros do período" hidden>
    <div class="pctlrow">
      <div class="tabs" role="group" aria-label="Tipo">
        <button type="button" data-ptipo="despesa" aria-pressed="true">Despesas</button>
        <button type="button" data-ptipo="receita" aria-pressed="false">Receitas</button>
      </div>
      <div class="field">
        <label for="pper">Período</label>
        <select id="pper"></select>
      </div>
    </div>
    <div class="pcustom" id="pcustom" hidden>
      <div class="field"><label for="pde">De</label><select id="pde"></select></div>
      <div class="field"><label for="pate">Até</label><select id="pate"></select></div>
    </div>
    <p class="hint" id="prange"></p>
  </section>
  <section class="card sum" id="psum" aria-label="Resumo do período" hidden></section>
  <section class="card" id="pchart" hidden>
    <div class="cardhead"><h2 id="pchartTitle">Por mês</h2></div>
    <div id="pchartBox"></div>
  </section>
  <section class="card" id="pbrk" hidden>
    <div class="cardhead"><h2>Por categoria</h2></div>
    <div id="pbrkBox"></div>
  </section>
  <section class="card" id="plist" hidden>
    <div class="cardhead"><h2>Lançamentos do período</h2></div>
    <div id="plistBox"></div>
  </section>

  <section class="card sum" id="sum" aria-label="Resumo do mês"></section>

  <form class="card" id="formCard" autocomplete="off">
    <h2>Novo lançamento</h2>
    <div class="seg" role="group" aria-label="Tipo de lançamento">
      <button type="button" id="tDespesa" data-tipo="despesa" aria-pressed="true">Despesa</button>
      <button type="button" id="tReceita" data-tipo="receita" aria-pressed="false">Receita</button>
    </div>
    <div class="field">
      <label for="valor">Valor</label>
      <div class="money"><span>R$</span><input id="valor" class="num" inputmode="decimal" placeholder="0,00" autocomplete="off"></div>
    </div>
    <div class="field">
      <label for="cat">Categoria</label>
      <select id="cat"></select>
      <div class="newcat" id="newcatRow" hidden>
        <input id="newcat" maxlength="24" placeholder="Nome da categoria" aria-label="Nome da nova categoria">
        <button type="button" class="secondary" id="btnNewcat">Criar</button>
      </div>
    </div>
    <div class="field">
      <label for="data">Data</label>
      <input type="date" id="data">
    </div>
    <div class="field">
      <label for="obs">Observação <span class="opt">(opcional)</span></label>
      <input id="obs" maxlength="140" placeholder="Ex.: mercado, gasolina, conta de luz">
    </div>
    <button type="submit" class="primary" id="btnAdd" disabled>Adicionar despesa</button>
    <p id="msg" role="status"></p>
  </form>

  <section class="card" id="chartCard">
    <div class="cardhead">
      <h2>Receitas x despesas</h2>
      <div class="legend"><span class="r"><i></i>Receitas</span><span class="d"><i></i>Despesas</span></div>
    </div>
    <div id="chart"></div>
  </section>

  <section class="card" id="listCard">
    <div class="cardhead"><h2 id="listTitle">Lançamentos</h2></div>
    <div id="lista"></div>
  </section>

  <section class="card" id="brkCard">
    <div class="cardhead">
      <h2>Por categoria</h2>
      <div class="tabs" role="group" aria-label="Tipo para o detalhamento">
        <button type="button" data-aba="despesa" aria-pressed="true">Despesas</button>
        <button type="button" data-aba="receita" aria-pressed="false">Receitas</button>
      </div>
    </div>
    <div id="brk"></div>
  </section>

  <section class="card" id="bkCard">
    <div class="cardhead"><h2>Backup</h2></div>
    <p class="hint">Os dados ficam só neste aparelho. Exporte uma cópia de tempos em tempos, ou para levar tudo para outro celular.</p>
    <div class="bkrow">
      <button type="button" class="secondary" id="btnExp">Exportar backup</button>
      <button type="button" class="secondary" id="btnImp">Importar backup</button>
      <input type="file" id="fileImp" accept="application/json,.json" hidden>
    </div>
    <p id="bkmsg" role="status"></p>
  </section>

  <p id="foot"></p>
</div>
<script>
(function () {
  'use strict';

  var DEF = {
    receita: ['Salário', 'Reembolsos', 'Presentes', 'Rendimentos', 'Freelance'],
    despesa: ['Alimentação', 'Transporte', 'Casa', 'Contas', 'Saúde', 'Lazer', 'Educação', 'Compras', 'Presentes']
  };
  var BRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
  var CMP = new Intl.NumberFormat('pt-BR', { notation: 'compact', maximumFractionDigits: 1 });
  var MINUS = '−';

  function pad(n) { return String(n).padStart(2, '0'); }
  function hoje() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function mesDe(iso) { return String(iso).slice(0, 7); }
  function fmt(c) { return BRL.format(c / 100); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function $(id) { return document.getElementById(id); }
  function shiftMes(m, d) { var p = m.split('-').map(Number); var dt = new Date(p[0], p[1] - 1 + d, 1); return dt.getFullYear() + '-' + pad(dt.getMonth() + 1); }
  function cap1(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function labelMes(m) { var p = m.split('-').map(Number); return cap1(new Date(p[0], p[1] - 1, 1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' })); }
  function curtoMes(m) { var p = m.split('-').map(Number); return new Date(p[0], p[1] - 1, 1).toLocaleDateString('pt-BR', { month: 'short' }).replace(/\./g, ''); }
  function labelDia(iso) { var p = iso.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]).toLocaleDateString('pt-BR', { weekday: 'short', day: 'numeric', month: 'short' }).replace(/\./g, ''); }

  function parseValor(txt) {
    var s = String(txt).replace(/R\$/gi, '').replace(/\s/g, '');
    if (!s) return NaN;
    if (s.indexOf(',') >= 0) s = s.replace(/\./g, '').replace(',', '.');
    else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
    if (!/^\d+(\.\d{1,2})?$/.test(s)) return NaN;
    return Math.round(parseFloat(s) * 100);
  }

  function niceMax(v) {
    if (v <= 0) return 100;
    var exp = Math.pow(10, Math.floor(Math.log10(v)));
    var f = v / exp;
    var nf = f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10;
    return nf * exp;
  }

  var state = {
    lanc: [], custom: { receita: [], despesa: [] },
    mes: hoje().slice(0, 7), tipo: 'despesa', aba: 'despesa',
    pendente: null, pronto: false, erro: '', modo: 'local',
    view: 'mes', ptipo: 'despesa', pper: 'ano:' + hoje().slice(0, 4), pde: null, pate: null, pall: false

  /* ---------- períodos ---------- */
  function anoAtual() { return hoje().slice(0, 4); }

  }
  function limitesMeses() {

  }
  function listaMeses(a, b) {

  }
  function rangePer() {
    var lim = limitesMeses(), first = lim[0], last = lim[1], v = state.pper, a, b;

  function barChart(items, cls, W, minLabel) {

    var k;
    for (k = 0; k <= 5; k++) {
      var gy = T + ph * (1 - k / 5);
      s += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + gy.toFixed(1) + '" y2="' + gy.toFixed(1) + '"/>';
      s += '<text x="' + (L - 8) + '" y="' + gy.toFixed(1) + '" text-anchor="end" dy="0.32em">' + CMP.format(max * k / 5) + '</text>';

      if (h && band >= 44) s += '<text class="sel" x="' + cx.toFixed(1) + '" y="' + (T + ph - h - 5).toFixed(1) + '" text-anchor="middle">' + CMP.format(it.value / 100) + '</text>';
      if (i % step === 0) s += '<text x="' + cx.toFixed(1) + '" y="' + (H - 9) + '" text-anchor="middle">' + esc(it.label) + '</text>';

  function renderView() {

  function renderPer() {

    var lim = limitesMeses(), anos = {};

    var yl = Object.keys(anos).sort().reverse();
    var opts = [['ano:' + anoAtual(), 'Este ano (' + anoAtual() + ')'], ['12m', 'Últimos 12 meses']];
    yl.forEach(function (y) { if (y !== anoAtual()) opts.push(['ano:' + y, 'Ano ' + y]); });

    var total = 0, porMes = {}, by = {};

      by[l.categoria] = (by[l.categoria] || 0) + l.centavos;

    $('prange').textContent = (a === b ? labelMes(a) : labelMes(a) + ' a ' + labelMes(b)) + ' · ' + meses.length + (meses.length === 1 ? ' mês' : ' meses');

      '<div><div class="k">Média por mês</div><div class="v num">' + fmt(meses.length ? Math.round(total / meses.length) : 0) + '</div></div>' +
      '<div class="saldo"><div class="k">Lançamentos</div><div class="v num">' + itens.length + '</div></div>';

  var rsz; window.addEventListener('resize', function () { clearTimeout(rsz); rsz = setTimeout(function () { renderChart(); renderPer(); }, 150); });

  /* ---------- armazenamento ---------- */
  var LS = 'livro-caixa-v1';
  function localStore() {

      add: function (rec) { rec.id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6); state.lanc.push(rec); save(); render(); return Promise.resolve(); },
      remove: function (id) { state.lanc = state.lanc.filter(function (l) { return l.id !== id; }); save(); render(); return Promise.resolve(); },

  function start() {

  document.addEventListener('click', function (e) {

      state.aba = t.getAttribute('data-aba'); renderBrk();
    } else if (t.hasAttribute('data-gomes')) {
      state.mes = t.getAttribute('data-gomes'); state.pendente = null; render();
    } else if (t.hasAttribute('data-del')) {
      state.pendente = t.getAttribute('data-del'); renderList();
    } else if (t.hasAttribute('data-no')) {
      state.pendente = null; renderList();
    } else if (t.hasAttribute('data-ok')) {
      var id = t.getAttribute('data-ok');
      state.pendente = null;
      if (store) store.remove(id).catch(function () { say('Não foi possível excluir. Tente de novo.', 'err'); });
      renderList();
    }
  });

  document.addEventListener('keydown', function (e) {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.getAttribute && (e.target.getAttribute('data-gomes') || e.target.getAttribute('data-pgo'))) {
      e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles: true }));
    }
  });

  $('cat').addEventListener('change', function () {
    var nova = $('cat').value === '__nova__';
    $('newcatRow').hidden = !nova;
    if (nova) $('newcat').focus();
  });
  $('btnNewcat').addEventListener('click', addCat);
  $('newcat').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); addCat(); } });

  $('formCard').addEventListener('submit', function (e) {
    e.preventDefault();
    if (!store) return;
    var centavos = parseValor($('valor').value);
    if (!(centavos > 0)) { say('Informe um valor maior que zero, por exemplo 25,90.', 'err'); $('valor').focus(); return; }
    var categoria = $('cat').value;
    if (!categoria || categoria === '__nova__') { say('Escolha uma categoria.', 'err'); return; }
    var data = $('data').value || hoje();
    var rec = { tipo: state.tipo, centavos: centavos, categoria: categoria, data: data, obs: $('obs').value.trim(), criadoEm: Date.now() };
    $('btnAdd').disabled = true;
    store.add(rec).then(function () {
      say((rec.tipo === 'despesa' ? 'Despesa' : 'Receita') + ' de ' + fmt(centavos) + ' adicionada.', 'ok');
      $('valor').value = ''; $('obs').value = ''; $('data').value = hoje();
      if (mesDe(data) !== state.mes) { state.mes = mesDe(data); render(); }
      $('valor').focus();
    }).catch(function (err) {
      say(err && err.code === 'quota_exceeded' ? 'O limite de lançamentos foi atingido. Exclua algum para continuar.' : 'Não foi possível salvar. Tente de novo.', 'err');
    }).then(function () { $('btnAdd').disabled = !state.pronto; });
  });

  /* ---------- abas e períodos ---------- */
  document.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('[data-view],[data-ptipo],[data-pgo],[data-pmore]') : null;
    if (!t) return;
    if (t.hasAttribute('data-view')) {
      state.view = t.getAttribute('data-view'); state.pendente = null; render();
    } else if (t.hasAttribute('data-ptipo')) {
      state.ptipo = t.getAttribute('data-ptipo'); state.pall = false; renderPer();
    } else if (t.hasAttribute('data-pgo')) {
      state.mes = t.getAttribute('data-pgo'); state.view = 'mes'; state.pendente = null; render();
    } else if (t.hasAttribute('data-pmore')) {
      state.pall = !state.pall; renderPer();
    }
  });
  $('pper').addEventListener('change', function () { state.pper = $('pper').value; state.pall = false; renderPer(); });
  $('pde').addEventListener('change', function () { state.pde = $('pde').value; state.pall = false; renderPer(); });
  $('pate').addEventListener('change', function () { state.pate = $('pate').value; state.pall = false; renderPer(); });

  /* ---------- backup ---------- */
  function bkSay(t, c) { var m = $('bkmsg'); m.textContent = t; m.className = c || ''; }
  $('btnExp').addEventListener('click', function () {
    try {
      var data = JSON.stringify({ app: 'livro-caixa', versao: 1, exportadoEm: new Date().toISOString(), lanc: state.lanc, custom: state.custom }, null, 2);
      var blob = new Blob([data], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'livro-caixa-' + hoje() + '.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
      bkSay('Backup gerado com ' + state.lanc.length + ' lançamentos.', 'ok');
    } catch (e) { bkSay('Não foi possível gerar o backup.', 'err'); }
  });
  $('btnImp').addEventListener('click', function () { $('fileImp').click(); });
  $('fileImp').addEventListener('change', function () {
    var f = $('fileImp').files && $('fileImp').files[0];
    if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var d = JSON.parse(rd.result);
        if (!d || d.app !== 'livro-caixa' || !Array.isArray(d.lanc)) throw new Error('formato');
        var ids = {};
        state.lanc.forEach(function (l) { ids[l.id] = 1; });
        var novos = 0;
        d.lanc.forEach(function (l) {
          if (l && typeof l.centavos === 'number' && l.data && (l.tipo === 'receita' || l.tipo === 'despesa') && l.categoria && l.id && !ids[l.id]) {
            state.lanc.push(l); ids[l.id] = 1; novos++;
          }
        });
        ['receita', 'despesa'].forEach(function (t) {
          ((d.custom && d.custom[t]) || []).forEach(function (c) { if (typeof c === 'string' && state.custom[t].indexOf(c) < 0) state.custom[t].push(c); });
        });
        store.saveCats().then(function () { fillCats(); render(); bkSay(novos + ' lançamentos importados.', 'ok'); });
      } catch (e) { bkSay('Arquivo inválido. Escolha um backup gerado por este app.', 'err'); }
      $('fileImp').value = '';
    };
    rd.readAsText(f);
  });

  /* ---------- início ---------- */
  $('data').value = hoje();
  fillCats(); renderForm(); render();
  start();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
})();
</script>
</body>
</html>
